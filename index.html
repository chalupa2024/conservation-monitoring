<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conservation Monitoring Dashboard | Friends of Desert Mountains</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h1 {
            color: #2d3748;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border-left: 5px solid;
        }

        .stat-card.overdue { border-color: #f56565; }
        .stat-card.upcoming { border-color: #ed8936; }
        .stat-card.current { border-color: #48bb78; }
        .stat-card.total { border-color: #4299e1; }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #718096;
            font-size: 0.95em;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .main-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .section-title {
            font-size: 1.5em;
            color: #2d3748;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .project-list {
            display: grid;
            gap: 25px;
        }

        .project-group {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e2e8f0;
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #667eea;
        }

        .group-name {
            font-size: 1.3em;
            color: #2d3748;
            font-weight: 700;
            margin: 0;
        }

        .group-count {
            background: #667eea;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .group-projects {
            display: grid;
            gap: 12px;
        }

        .project-card {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .project-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .project-card.overdue {
            border-left: 6px solid #f56565;
            background: #fff5f5;
        }

        .project-card.due-soon {
            border-left: 6px solid #ed8936;
            background: #fffaf0;
        }

        .project-card.on-track {
            border-left: 6px solid #48bb78;
            background: #f0fff4;
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .project-card .project-name {
            font-weight: 600;
            font-size: 1em;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .project-id {
            color: #718096;
            font-size: 0.9em;
        }

        .project-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-quarterly {
            background: #bee3f8;
            color: #2c5282;
        }

        .badge-biannual {
            background: #feebc8;
            color: #7c2d12;
        }

        .badge-annual {
            background: #c6f6d5;
            color: #22543d;
        }

        .project-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.85em;
            color: #718096;
            margin-bottom: 3px;
        }

        .detail-value {
            font-weight: 600;
            color: #2d3748;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-overdue { background: #f56565; }
        .status-upcoming { background: #ed8936; }
        .status-good { background: #48bb78; }

        .loading {
            text-align: center;
            padding: 60px;
            color: #718096;
        }

        .error {
            background: #fff5f5;
            border: 2px solid #fc8181;
            padding: 20px;
            border-radius: 10px;
            color: #742a2a;
        }

        .timeline-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 30px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -23px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #667eea;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            left: -18px;
            top: 17px;
            width: 2px;
            height: calc(100% - 12px);
            background: #e2e8f0;
        }

        .timeline-item:last-child::after {
            display: none;
        }

        .timeline-date {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
        }

        .timeline-projects {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .timeline-project {
            padding: 8px 15px;
            background: #f7fafc;
            border-radius: 6px;
            font-size: 0.9em;
            border-left: 3px solid #667eea;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-group {
                flex-direction: column;
            }
        }

        .refresh-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏔️ Conservation Monitoring Dashboard</h1>
            <p class="subtitle">Friends of Desert Mountains - Riverside County</p>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card overdue">
                <div class="stat-number" id="overdueCount">-</div>
                <div class="stat-label">Overdue Inspections</div>
            </div>
            <div class="stat-card upcoming">
                <div class="stat-number" id="upcomingCount">-</div>
                <div class="stat-label">Due Next 60 Days</div>
            </div>
            <div class="stat-card current">
                <div class="stat-number" id="completedCount">-</div>
                <div class="stat-label">Completed This Year</div>
            </div>
            <div class="stat-card total">
                <div class="stat-number" id="totalCount">-</div>
                <div class="stat-label">Total Active Projects</div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <button class="filter-btn active" data-interval="all">All Projects</button>
                <button class="filter-btn" data-interval="Quarterly">Quarterly</button>
                <button class="filter-btn" data-interval="Biannual">Biannual</button>
                <button class="filter-btn" data-interval="Annual">Annual</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by project name, APN, or conservation area...">
            </div>
            <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
        </div>

        <div class="main-content">
            <div id="content">
                <div class="loading">
                    <h3>Loading monitoring data...</h3>
                    <p>Connecting to Google Sheets</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const SPREADSHEET_ID = '1fsJGE7QBfrNxx8x-Ccb6QzluCwltTiIVwREcGIYS6ls';
        const API_KEY = 'AIzaSyAsAejeigE-UB1htQO3uaxkF3MWG42eiJA';
        const SHEET_NAME = '2025'; // Adjust if your sheet has a different name
        
        let allProjects = [];
        let currentFilter = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            setupFilters();
            setupSearch();
            loadData();
        });

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.interval;
                    renderProjects();
                });
            });
        }

        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', function(e) {
                renderProjects(e.target.value);
            });
        }

        async function loadData() {
            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${SHEET_NAME}?key=${API_KEY}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch data. Please check your API key and sheet permissions.');
                }
                
                const data = await response.json();
                processData(data.values);
            } catch (error) {
                showError(error.message);
            }
        }

        function processData(rows) {
            // Skip header row
            const dataRows = rows.slice(1);
            
            allProjects = dataRows
                .filter(row => row[10]) // Has a Report Interval
                .map(row => {
                    const nextDate = row[13]; // 2025 Date Inspected
                    const lastDate = row[12]; // 2024 Date Inspected
                    
                    return {
                        fundingSource: row[0] || '',
                        projectNumber: row[1] || '',
                        apn: row[2] || '',
                        conservationArea: row[3] || '',
                        projectName: row[4] || '',
                        status: row[5] || '',
                        interval: row[10] || '',
                        lastInspection: lastDate || 'Not yet',
                        nextInspection: nextDate || 'TBD',
                        actionNeeded: row[14] || 'No Action Required',
                        reportLink: row[15] || ''
                    };
                })
                .filter(p => p.interval && p.interval !== 'Multi parcel grant');

            updateStats();
            renderProjects();
        }

        function updateStats() {
            const today = new Date();
            const sixtyDaysFromNow = new Date(today.getTime() + (60 * 24 * 60 * 60 * 1000));
            
            let overdue = 0;
            let upcoming = 0;
            let completed = 0;

            allProjects.forEach(project => {
                const nextDate = parseDate(project.nextInspection);
                const lastDate = parseDate(project.lastInspection);

                if (nextDate) {
                    if (nextDate < today) {
                        overdue++;
                    } else if (nextDate <= sixtyDaysFromNow) {
                        upcoming++;
                    }
                }

                if (lastDate && lastDate.getFullYear() === 2025) {
                    completed++;
                }
            });

            document.getElementById('overdueCount').textContent = overdue;
            document.getElementById('upcomingCount').textContent = upcoming;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = allProjects.length;
        }

        function renderProjects(searchTerm = '') {
            let filtered = allProjects;

            // Apply interval filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(p => p.interval === currentFilter);
            }

            // Apply search filter
            if (searchTerm) {
                const search = searchTerm.toLowerCase();
                filtered = filtered.filter(p =>
                    p.projectName.toLowerCase().includes(search) ||
                    p.apn.toLowerCase().includes(search) ||
                    p.conservationArea.toLowerCase().includes(search) ||
                    p.projectNumber.toLowerCase().includes(search)
                );
            }

            // Sort by next inspection date
            filtered.sort((a, b) => {
                const dateA = parseDate(a.nextInspection);
                const dateB = parseDate(b.nextInspection);
                if (!dateA) return 1;
                if (!dateB) return -1;
                return dateA - dateB;
            });

            const content = document.getElementById('content');

            if (filtered.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3>No projects found</h3>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
                return;
            }

            // Group projects by Project # (projectNumber)
            const groupedProjects = {};
            filtered.forEach(project => {
                if (!groupedProjects[project.projectNumber]) {
                    groupedProjects[project.projectNumber] = [];
                }
                groupedProjects[project.projectNumber].push(project);
            });

            // Sort groups by earliest next inspection date
            const sortedGroups = Object.entries(groupedProjects).sort((a, b) => {
                const dateA = parseDate(a[1][0].nextInspection);
                const dateB = parseDate(b[1][0].nextInspection);
                if (!dateA) return 1;
                if (!dateB) return -1;
                return dateA - dateB;
            });

            const html = `
                <h2 class="section-title">Active Monitoring Projects (${filtered.length})</h2>
                <div class="project-list">
                    ${sortedGroups.map(([projectNumber, projects]) => createProjectGroup(projectNumber, projects)).join('')}
                </div>
            `;

            content.innerHTML = html;
        }

        function createProjectGroup(projectNumber, projects) {
            const parcelCount = projects.length;
            const countLabel = parcelCount > 1 ? `${parcelCount} parcels` : '1 parcel';

            return `
                <div class="project-group">
                    <div class="group-header">
                        <h3 class="group-name">${projectNumber}</h3>
                        <span class="group-count">${countLabel}</span>
                    </div>
                    <div class="group-projects">
                        ${projects.map(project => createProjectCard(project)).join('')}
                    </div>
                </div>
            `;
        }

        function createProjectCard(project) {
            const statusClass = getStatusClass(project.nextInspection);
            const badgeClass = getBadgeClass(project.interval);
            const statusIndicator = getStatusIndicator(project.nextInspection);

            return `
                <div class="project-card ${statusClass}">
                    <div class="project-header">
                        <div>
                            <div class="project-name">${project.projectName}</div>
                            <div class="project-id">${project.conservationArea}</div>
                        </div>
                        <span class="project-badge ${badgeClass}">${project.interval}</span>
                    </div>
                    <div class="project-details">
                        <div class="detail-item">
                            <span class="detail-label">APN</span>
                            <span class="detail-value">${project.apn}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Last Inspection</span>
                            <span class="detail-value">${project.lastInspection}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Next Inspection</span>
                            <span class="detail-value">
                                <span class="status-indicator ${statusIndicator}"></span>
                                ${project.nextInspection}
                            </span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Funding Source</span>
                            <span class="detail-value">${project.fundingSource}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function getStatusClass(dateStr) {
            const date = parseDate(dateStr);
            if (!date) return 'on-track';
            
            const today = new Date();
            const thirtyDaysFromNow = new Date(today.getTime() + (30 * 24 * 60 * 60 * 1000));

            if (date < today) return 'overdue';
            if (date <= thirtyDaysFromNow) return 'due-soon';
            return 'on-track';
        }

        function getStatusIndicator(dateStr) {
            const date = parseDate(dateStr);
            if (!date) return 'status-good';
            
            const today = new Date();
            const thirtyDaysFromNow = new Date(today.getTime() + (30 * 24 * 60 * 60 * 1000));

            if (date < today) return 'status-overdue';
            if (date <= thirtyDaysFromNow) return 'status-upcoming';
            return 'status-good';
        }

        function getBadgeClass(interval) {
            if (interval === 'Quarterly') return 'badge-quarterly';
            if (interval === 'Biannual') return 'badge-biannual';
            if (interval === 'Annual') return 'badge-annual';
            return 'badge-quarterly';
        }

        function parseDate(dateStr) {
            if (!dateStr || dateStr === 'TBD' || dateStr === 'Not yet') return null;
            const date = new Date(dateStr);
            return isNaN(date.getTime()) ? null : date;
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <h3>⚠️ Error Loading Data</h3>
                    <p>${message}</p>
                    <br>
                    <p><strong>Setup Instructions:</strong></p>
                    <ol style="margin-left: 20px; margin-top: 10px;">
                        <li>Go to <a href="https://console.cloud.google.com/" target="_blank">Google Cloud Console</a></li>
                        <li>Create a new project or select existing one</li>
                        <li>Enable the Google Sheets API</li>
                        <li>Create an API key in Credentials</li>
                        <li>Replace 'YOUR_API_KEY_HERE' in this file with your API key</li>
                        <li>Make sure your spreadsheet is publicly accessible (Anyone with the link can view)</li>
                    </ol>
                </div>
            `;
        }
    </script>
</body>
</html>
